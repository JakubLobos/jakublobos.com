name: CI

on:
  push:
    branches: [main]
  pull_request:
  # Reused by deploy-site.yml so a deploy passes the same gates.
  workflow_call:

permissions:
  contents: read

# github.workflow is the caller's name when reused, so the two groups never collide.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  WRANGLER_SEND_METRICS: 'false'

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
      - run: pnpm verify

  e2e:
    needs: verify
    # Pinned: Playwright's browser builds and their system libraries follow the Ubuntu release, so
    # a moving ubuntu-latest can break them (26.04 dropped the ICU 74 that WebKit links against).
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
      - uses: ./.github/actions/playwright
        with:
          browsers: chromium webkit
      - run: pnpm test:e2e
      - if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playwright-report
          path: |
            playwright-report
            test-results
          retention-days: 7

  # The Node edge emulator used locally is only trustworthy while real workerd agrees with it.
  edge-parity:
    needs: verify
    # Pinned: Playwright's browser builds and their system libraries follow the Ubuntu release, so
    # a moving ubuntu-latest can break them (26.04 dropped the ICU 74 that WebKit links against).
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      E2E_EDGE: wrangler
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
      - uses: ./.github/actions/playwright
        with:
          browsers: chromium
      - run: pnpm test:e2e --project=chromium-desktop --grep "@smoke|@parity"
      # Always kept: the report records what real workerd does with redirects (see the spec).
      - if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: edge-parity-report
          path: |
            playwright-report
            test-results
          retention-days: 7

  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
      - run: pnpm audit --prod --audit-level=high

  # Docker is not available on the maintainer's machine, so this job is the only proof that the
  # production image builds, starts as non-root, loads the native SQLite module and keeps its data.
  api-image:
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      IMAGE: portfolio-api
      CONTAINER: portfolio-api-ci
      VOLUME: portfolio-api-ci-data
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Build
        run: docker build -f apps/server/Dockerfile -t "$IMAGE" .
      - name: Image is small and runs as a non-root user
        run: |
          size=$(docker image inspect "$IMAGE" --format '{{.Size}}')
          echo "image size: $((size / 1024 / 1024)) MiB"
          test "$size" -lt $((250 * 1024 * 1024))
          user=$(docker image inspect "$IMAGE" --format '{{.Config.User}}')
          echo "configured user: $user"
          test "$user" = node
      - name: Start with test configuration
        run: |
          docker run -d --name "$CONTAINER" -p 3000:3000 -v "$VOLUME:/data" \
            --health-interval=2s --health-start-period=2s --health-retries=10 \
            -e NODE_ENV=test \
            -e MODERATION_PROVIDER=fake -e SUITABILITY_PROVIDER=fake \
            -e MAILER=console -e HUMAN_VERIFIER=fake \
            -e CONTACT_PHONE=+48000000000 \
            -e DATABASE_PATH=/data/portfolio.db \
            -e CORS_ALLOWED_ORIGINS=http://localhost:8787 \
            "$IMAGE"
      - name: Healthy, non-root process, SQLite loaded
        run: |
          for _ in $(seq 30); do
            test "$(docker inspect -f '{{.State.Health.Status}}' "$CONTAINER")" = healthy && break
            sleep 2
          done
          docker inspect -f '{{.State.Health.Status}}' "$CONTAINER" | grep -x healthy
          # The route runs SELECT 1, so db "ok" proves better-sqlite3's native binding loaded.
          curl -fsS http://localhost:3000/api/health | tee /dev/stderr | grep -F '"db":"ok"'
          test "$(docker exec "$CONTAINER" id -u)" != 0
      - name: Guestbook round trip survives a restart
        run: |
          status=$(curl -s -o /dev/null -w '%{http_code}' -X POST http://localhost:3000/api/guestbook \
            -H 'Content-Type: application/json' -H 'Origin: http://localhost:8787' \
            -d "{\"body\":\"Hello from CI\",\"paint\":\"violet\",\"clientRequestId\":\"$(cat /proc/sys/kernel/random/uuid)\",\"website\":\"\"}")
          test "$status" = 202
          docker exec "$CONTAINER" node src/cli/guestbook-admin.ts list | grep -F 'Hello from CI'
          docker restart "$CONTAINER"
          for _ in $(seq 30); do
            curl -fsS http://localhost:3000/api/health >/dev/null 2>&1 && break
            sleep 2
          done
          docker exec "$CONTAINER" node src/cli/guestbook-admin.ts list | grep -F 'Hello from CI'
      - name: Production refuses fake providers
        run: |
          set +e
          out=$(docker run --rm -e NODE_ENV=production -e MODERATION_PROVIDER=fake -e MAILER=console "$IMAGE" 2>&1)
          code=$?
          echo "$out"
          test "$code" -eq 1
          echo "$out" | grep -F 'Invalid configuration'
      - name: Logs and cleanup
        if: ${{ always() }}
        run: |
          docker logs "$CONTAINER" || true
          docker rm -f "$CONTAINER" || true
          docker volume rm "$VOLUME" || true
